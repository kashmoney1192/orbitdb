<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitDB - Space Missions</title>
    <meta name="description" content="Explore a comprehensive database of historic and modern space missions.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="topbar">
        <button id="backBtn" class="back-btn hidden">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            BACK
        </button>
        <div class="logo">
            <h1>ORBIT<span>DB</span></h1>
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="appContainer">
        
        <!-- HOME VIEW -->
        <div id="homeView" class="view">
            
            <section class="home-section">
                <h2 class="section-title">FEATURED</h2>
                <div class="carousel-container">
                    <div id="featuredCarousel" class="carousel">
                        <!-- Featured missions rendered here -->
                    </div>
                </div>
            </section>

            <section class="home-section">
                <h2 class="section-title" id="onThisDayTitle">ON THIS DAY</h2>
                <div id="onThisDayContainer" class="vertical-feed">
                    <!-- Events and Missions rendered here -->
                </div>
            </section>

            <section class="home-section">
                <h2 class="section-title">TOP RATED</h2>
                <div id="topRatedContainer" class="vertical-feed">
                    <!-- Top 10 rated missions rendered here -->
                </div>
            </section>
        </div>

        <!-- BROWSE VIEW -->
        <div id="browseView" class="view hidden">
            <div class="search-header">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search missions, astronauts, or agencies...">
                </div>
                <select id="agencyFilter">
                    <option value="all">All Agencies</option>
                    <option value="NASA">NASA</option>
                    <option value="Soviet">Soviet/Roscosmos</option>
                    <option value="SpaceX">SpaceX</option>
                    <option value="ESA">ESA</option>
                </select>
            </div>
            
            <section class="mission-grid" id="missionGrid">
                <!-- Search results rendered here -->
            </section>
            
            <div id="noResults" class="no-results hidden">
                <h3>NO MISSIONS FOUND.</h3>
            </div>
        </div>

        <!-- MISSION DETAIL VIEW -->
        <div id="detailView" class="view hidden">
            <div id="detailContainer">
                <!-- Details rendered here -->
            </div>
        </div>

    </main>

    <!-- Bottom Tab Navigation -->
    <nav class="bottom-tabs">
        <button class="tab-btn active" data-target="homeView">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 3L20 9V21H15V14H9V21H4V9L12 3Z"/>
            </svg>
            HOME
        </button>
        <button class="tab-btn" data-target="browseView">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            BROWSE
        </button>
    </nav>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
